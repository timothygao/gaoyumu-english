<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三下英语 U1-U6 纯默写卷</title>
<style>
:root {
  --ink:#24384c;--muted:#667d90;--blue:#2c77b7;--line:#d5e6ef;--paper:#fffdf8;
  --green:#187148;--green-soft:#ecfaf2;--red:#ad4141;--red-soft:#fff1f1;
  --gold:#94600b;--gold-soft:#fff6e2;--shadow:0 12px 28px rgba(28,62,91,.10)
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#edf8ff 0%,#f9fbfc 46%,#fff8ea 100%);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);line-height:1.6}
.page{max-width:1100px;margin:0 auto;padding:25px 16px 58px}
.hero{position:relative;overflow:hidden;padding:28px 30px;border-radius:22px;border:1px solid #cfe5f3;background:linear-gradient(135deg,#e8f7ff,#fffdf7 68%,#fff2d4);box-shadow:var(--shadow)}
.hero:after{content:"Aa";position:absolute;right:24px;top:-42px;font-size:150px;font-family:Georgia,serif;font-weight:900;color:rgba(44,119,183,.08)}
h1{position:relative;z-index:1;margin:0;font-size:30px;letter-spacing:.3px}
.subtitle{position:relative;z-index:1;margin:7px 0 0;color:var(--muted);font-size:16px}
.badges{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.badge{padding:4px 10px;border-radius:999px;border:1px solid #c8e0f1;background:rgba(255,255,255,.82);color:#2a6594;font-size:13px}
.notice{position:relative;z-index:1;margin-top:17px;padding:13px 15px;border-left:4px solid #c78115;border-radius:10px;background:var(--gold-soft);font-size:14px}
.launch{position:relative;z-index:1;margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{flex:1;min-width:180px}
label{display:block;margin-bottom:4px;font-size:13px;font-weight:800;color:#405c75}
input,select{width:100%;padding:10px 11px;border:1.5px solid #bdd6e6;border-radius:10px;outline:none;background:#fff;color:var(--ink);font-size:15px}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(44,119,183,.12)}
button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer;transition:.18s transform,.18s box-shadow}
button:hover{transform:translateY(-1px);box-shadow:0 8px 16px rgba(24,62,93,.15)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.primary{background:var(--blue);color:#fff}.ghost{background:#fff;color:#26597f;border:1px solid #c7ddea}
.overview{margin:20px 0 12px;padding:13px 16px;display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 4px 12px rgba(25,62,92,.05)}
.overview b{font-size:17px}.progress-wrap{display:flex;align-items:center;gap:9px;min-width:300px}.progress{height:10px;flex:1;overflow:hidden;border-radius:999px;background:#e7eff4}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#48b3dc,#2c77b7);transition:.25s}.progress-text{font-size:12px;color:var(--muted);white-space:nowrap}
.tipbar{margin-bottom:12px;padding:11px 13px;border:1px solid #cce4f2;border-radius:11px;background:#f0f8ff;font-size:14px;color:#3f607b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{padding:16px;border:1px solid #dbe8ef;border-radius:15px;background:var(--paper);box-shadow:0 4px 12px rgba(28,58,83,.05)}
.card.correct{border-color:#a8dabb;background:#fbfffc}.card.wrong{border-color:#e7babb;background:#fffdfd}
.topline{display:flex;align-items:center;gap:8px}.no{display:inline-flex;width:29px;height:29px;align-items:center;justify-content:center;border-radius:50%;background:#eaf6ff;color:#23689c;font-size:12px;font-weight:900}.unit{font-size:12px;color:#71869a}.label{font-size:12px;color:#6e8295;margin-left:auto}
.prompt{margin:11px 0 10px;font-size:17px;font-weight:800}
.answer-row{display:flex;gap:8px;align-items:center}.answer-row input{font-size:16px;font-weight:800}
.feedback{display:none;margin-top:10px;padding:9px 10px;border-radius:9px;font-size:14px;line-height:1.55}.correct .feedback{display:block;background:var(--green-soft);color:#17623d}.wrong .feedback{display:block;background:var(--red-soft);color:#933838}
.sticky{position:sticky;bottom:12px;z-index:3;display:flex;justify-content:center;gap:9px;margin-top:24px;padding:11px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.report{display:none;margin-top:24px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}.report-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 21px;background:linear-gradient(135deg,#eff9ff,#f9fffb)}.report h2{margin:0;font-size:21px}.score{margin-top:5px;font-size:37px;font-weight:900;color:#236fa7;line-height:1.1}.report-body{padding:18px 21px}.review-box{padding:12px 14px;border-radius:11px;border:1px solid #eedaa9;background:var(--gold-soft)}.wrong-list{margin-top:13px;display:flex;gap:7px;flex-wrap:wrap}.wrong-chip{padding:4px 8px;border-radius:999px;border:1px solid #eed29a;background:#fffdf7;color:#81520d;font-size:13px}.footer{margin-top:22px;text-align:center;color:#6e8294;font-size:12px}
@media(max-width:760px){.page{padding:15px 10px 45px}.hero{padding:22px 18px}h1{font-size:25px}.grid{grid-template-columns:1fr}.overview{flex-direction:column;align-items:flex-start}.progress-wrap{width:100%;min-width:0}.sticky{flex-direction:column}.sticky button{width:100%}}
@media print{body{background:#fff}.hero,.overview,.card,.report{box-shadow:none}.sticky{position:static}}
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <h1>三下英语 U1-U6 自我默写卷 · 纯默写版</h1>
    <p class="subtitle">看中文，靠自己的记忆写出英文。没有选项、没有首字母提示，真正练“主动回忆”。</p>
    <div class="badges">
      <span class="badge">52个词汇、短语和句子</span>
      <span class="badge">中文 → 英文</span>
      <span class="badge">纯默写模式</span>
      <span class="badge">无提示作答</span>
      <span class="badge">批改后显示答案</span>
    </div>
    <div class="notice"><strong>推荐做法：</strong>先看中文，停两三秒，再自己拼出英文。不会的先空着，整张做完后再批改；这样比“看着提示写”更容易真正记住。</div>
    <div class="launch">
      <div class="field"><label for="student">姓名</label><input id="student" placeholder="例如：高语牧"></div>
      <div class="field">
        <label for="unitSelect">练习范围</label>
        <select id="unitSelect">
          <option value="ALL">U1-U6 全部默写（52题）</option>
          <option value="U1">U1</option><option value="U2">U2</option><option value="U3">U3</option>
          <option value="U4">U4</option><option value="U5">U5</option><option value="U6">U6</option>
          <option value="Revision">Revision 句子</option>
        </select>
      </div>
      <div class="field">
        <label for="orderSelect">题目顺序</label>
        <select id="orderSelect"><option value="shuffle">随机顺序（推荐）</option><option value="unit">按单元顺序</option></select>
      </div>
      <button class="primary" id="startBtn">开始默写</button>
    </div>
  </section>

  <section id="exam" style="display:none">
    <div class="overview">
      <div><b id="titleLine">英语自我默写卷</b><div style="font-size:13px;color:#677b8e">输入英文；大小写、句末标点不影响判定。短语中的空格尽量写对。</div></div>
      <div class="progress-wrap"><div class="progress"><i id="progressBar"></i></div><span class="progress-text" id="progressText">已写 0 / 0</span></div>
    </div>
    <div class="tipbar"><b>答题小规则：</b>不看提示，直接默写。不会的先空着，等全部写完再统一批改；错词才是这次最该复习的词。</div>
    <div class="grid" id="grid"></div>
    <div class="sticky"><button class="primary" id="gradeBtn">提交并查看批改</button><button class="ghost" id="resetBtn">重做本卷</button></div>
    <section class="report" id="report"></section>
  </section>
  <div class="footer">错词建议：读三遍、写两遍，10分钟后再默写一遍。</div>
</main>

<script>
const DATA = [{"unit": "U1", "cn": "先生", "en": "Mr", "alts": ["mr", "mr."]}, {"unit": "U1", "cn": "小姐", "en": "Miss", "alts": ["miss"]}, {"unit": "U1", "cn": "已婚女士", "en": "Mrs", "alts": ["mrs", "mrs."]}, {"unit": "U1", "cn": "菠萝饭", "en": "pineapple rice", "alts": []}, {"unit": "U1", "cn": "泰国", "en": "Thailand", "alts": []}, {"unit": "U2", "cn": "友好的", "en": "friendly", "alts": []}, {"unit": "U2", "cn": "表达自己", "en": "express ourselves", "alts": []}, {"unit": "U2", "cn": "有趣的", "en": "fun", "alts": ["interesting"]}, {"unit": "U3", "cn": "找到", "en": "find", "alts": []}, {"unit": "U3", "cn": "画一条线", "en": "draw a line", "alts": []}, {"unit": "U3", "cn": "写", "en": "write", "alts": []}, {"unit": "U3", "cn": "在课堂上", "en": "in class", "alts": []}, {"unit": "U3", "cn": "闻果皮", "en": "smell the peel", "alts": []}, {"unit": "U3", "cn": "听声音", "en": "hear the sound", "alts": []}, {"unit": "U3", "cn": "用……学习", "en": "use ... to learn", "alts": ["use...to learn", "use to learn"]}, {"unit": "U3", "cn": "老鹰", "en": "eagle", "alts": []}, {"unit": "U3", "cn": "工具", "en": "tool", "alts": []}, {"unit": "U4", "cn": "健康食品", "en": "healthy food", "alts": []}, {"unit": "U4", "cn": "早餐时间", "en": "breakfast time", "alts": []}, {"unit": "U4", "cn": "在家", "en": "at home", "alts": []}, {"unit": "U4", "cn": "垃圾食品", "en": "junk food", "alts": []}, {"unit": "U4", "cn": "健康餐盘", "en": "healthy plate", "alts": []}, {"unit": "U4", "cn": "需要锻炼", "en": "need to exercise", "alts": []}, {"unit": "U5", "cn": "仍然", "en": "still", "alts": []}, {"unit": "U5", "cn": "赠送", "en": "give away", "alts": []}, {"unit": "U5", "cn": "带去学校", "en": "take to school", "alts": []}, {"unit": "U5", "cn": "卖", "en": "sell", "alts": []}, {"unit": "U5", "cn": "墙壁", "en": "wall", "alts": []}, {"unit": "U5", "cn": "重复使用一些旧东西", "en": "reuse some old things", "alts": []}, {"unit": "U5", "cn": "周围；到处", "en": "all round", "alts": []}, {"unit": "U5", "cn": "留着", "en": "keep", "alts": []}, {"unit": "U6", "cn": "加", "en": "add", "alts": []}, {"unit": "U6", "cn": "数数", "en": "count", "alts": []}, {"unit": "U6", "cn": "处理旧物", "en": "do with old things", "alts": []}, {"unit": "U6", "cn": "需要", "en": "need", "alts": []}, {"unit": "U6", "cn": "存钱", "en": "save", "alts": []}, {"unit": "U6", "cn": "花钱", "en": "spend", "alts": []}, {"unit": "U6", "cn": "支付", "en": "pay", "alts": []}, {"unit": "U6", "cn": "放回", "en": "put ... back", "alts": ["put...back", "put back"]}, {"unit": "U6", "cn": "猪形储钱罐", "en": "piggy bank", "alts": []}, {"unit": "U6", "cn": "跳蚤市场；旧货市场", "en": "flea market", "alts": []}, {"unit": "U6", "cn": "有趣的", "en": "interesting", "alts": ["fun"]}, {"unit": "U6", "cn": "有用的", "en": "useful", "alts": []}, {"unit": "U6", "cn": "月份", "en": "month", "alts": []}, {"unit": "U6", "cn": "电话号码", "en": "mobile phone number", "alts": []}, {"unit": "U6", "cn": "三本17元", "en": "three for seventeen yuan", "alts": []}, {"unit": "U6", "cn": "五本书15元", "en": "fifteen yuan for five books", "alts": []}, {"unit": "U6", "cn": "每本书", "en": "each book", "alts": []}, {"unit": "Revision", "cn": "听起来很有趣。", "en": "Sounds fun!", "alts": ["sounds fun"]}, {"unit": "Revision", "cn": "亲爱的！", "en": "Honey!", "alts": ["honey"]}, {"unit": "Revision", "cn": "我会买下它。", "en": "I’ll take it.", "alts": ["I'll take it", "I will take it"]}, {"unit": "Revision", "cn": "我会买三个给我的家人。", "en": "I’ll take three for my family.", "alts": ["I'll take three for my family", "I will take three for my family"]}];
let active = [];
function $(id) { return document.getElementById(id); }
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function normalize(v) {
  return String(v ?? "")
    .toLowerCase()
    .trim()
    .replace(/[’‘]/g, "'")
    .replace(/[.。!！?？]/g, "")
    .replace(/…/g, "...")
    .replace(/\s+/g, " ");
}
function accepted(item, value) {
  const answers = [item.en, ...(item.alts || [])].map(normalize);
  return answers.includes(normalize(value));
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function render() {
  const grid = $("grid");
  grid.innerHTML = "";
  active.forEach((item, idx) => {
    const card = document.createElement("article");
    card.className = "card";
    card.id = "card-" + idx;
    card.innerHTML = `
      <div class="topline">
        <span class="no">${idx + 1}</span>
        <span class="unit">${esc(item.unit)}</span>
        <span class="label">中文 → 英文</span>
      </div>
      <div class="prompt">${esc(item.cn)}</div>
      <div class="answer-row"><input data-index="${idx}" autocomplete="off" spellcheck="false" placeholder="请自己默写英文"></div>
      <div class="feedback"></div>
    `;
    grid.appendChild(card);
  });
  document.querySelectorAll("input[data-index]").forEach(el => el.addEventListener("input", updateProgress));
  updateProgress();
}
function answerOf(i) {
  return document.querySelector(`input[data-index="${i}"]`)?.value || "";
}
function updateProgress() {
  const done = active.filter((_, i) => answerOf(i).trim() !== "").length;
  $("progressBar").style.width = (active.length ? done / active.length * 100 : 0) + "%";
  $("progressText").textContent = `已写 ${done} / ${active.length}`;
}
function grade() {
  let correct = 0;
  const wrong = [];
  active.forEach((item, i) => {
    const given = answerOf(i);
    const ok = accepted(item, given);
    if (ok) correct++; else wrong.push({i, item});
    const card = $("card-" + i);
    card.classList.remove("correct", "wrong");
    card.classList.add(ok ? "correct" : "wrong");
    const fb = card.querySelector(".feedback");
    fb.innerHTML = ok
      ? `<strong>写对了！</strong> 正确拼写：<b>${esc(item.en)}</b>`
      : `<strong>正确答案：<b>${esc(item.en)}</b></strong><br>你写的是：${esc(given || "（未作答）")}。`;
  });
  const score = Math.round(correct / active.length * 100);
  let advice = "";
  if (score >= 90) advice = "掌握得很稳。考前把本次错词再快速默写一遍即可。";
  else if (score >= 75) advice = "整体不错。把错词读三遍、写两遍，10分钟后再默写一次。";
  else if (score >= 60) advice = "有一些词是“眼熟但自己拼不出来”。先只重做错词，别急着刷新题。";
  else advice = "先把错词分成“单词、短语、句子”三类，每类慢慢读、写、再默写。";
  const report = $("report");
  const wrongHtml = wrong.length
    ? `<div style="margin-top:14px"><strong>本次需要二刷：</strong><div class="wrong-list">${wrong.map(x => `<span class="wrong-chip">第${x.i + 1}题：${esc(x.item.cn)}</span>`).join("")}</div></div>`
    : `<div class="review-box" style="margin-top:14px">全对！明天考前把最容易混的三组再口头说一遍：Mr / Miss / Mrs；save / spend / pay；give away / put ... back / take to school。</div>`;
  report.innerHTML = `
    <div class="report-head">
      <div><h2>默写批改报告</h2><div class="score">${score} <span style="font-size:16px">分</span></div><div style="font-size:13px;color:#64788b">写对 ${correct} / ${active.length} 个词汇、短语或句子</div></div>
      <span class="badge">答案已解锁</span>
    </div>
    <div class="report-body">
      <div class="review-box"><strong>下一步怎么复习：</strong>${advice}</div>
      ${wrongHtml}
    </div>
  `;
  report.style.display = "block";
  report.scrollIntoView({behavior:"smooth", block:"start"});
  document.querySelectorAll("#exam input").forEach(el => el.disabled = true);
  $("gradeBtn").disabled = true;
}
function reset() {
  $("report").style.display = "none";
  $("gradeBtn").disabled = false;
  document.querySelectorAll("#exam input").forEach(el => {
    el.disabled = false;
    el.value = "";
  });
  document.querySelectorAll(".card").forEach(el => el.classList.remove("correct", "wrong"));
  updateProgress();
  window.scrollTo({top:$("exam").offsetTop - 8, behavior:"smooth"});
}
$("startBtn").addEventListener("click", () => {
  const unit = $("unitSelect").value;
  const order = $("orderSelect").value;
  active = DATA.filter(x => unit === "ALL" || x.unit === unit);
  if (order === "shuffle") active = shuffle(active);
  const label = unit === "ALL" ? "U1-U6 全部" : unit;
  $("titleLine").textContent = ($("student").value.trim() ? $("student").value.trim() + "的" : "") + "英语自我默写卷 · " + label;
  $("exam").style.display = "block";
  render();
  $("exam").scrollIntoView({behavior:"smooth", block:"start"});
});
$("gradeBtn").addEventListener("click", grade);
$("resetBtn").addEventListener("click", reset);
</script>
<script>window.GAOSTUDY_CLOUD_CONFIG = {"child":"高语牧","type":"english","quizId":"gaoyumu-g3-english-u1u6-52","title":"三下英语U1-U6纯默写","phase":"复习"};</script>

</body>
